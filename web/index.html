<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSLV · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'hslv-green': '#76b82a',
            'hslv-green-dark': '#327531',
            'hslv-navy': '#29235c'
          },
          fontFamily: {
            display: ['Poppins', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-sm bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
    <div class="flex h-1">
      <div class="flex-1 bg-hslv-green"></div>
      <div class="flex-1 bg-hslv-green-dark"></div>
    </div>

    <div class="p-8">
      <div class="flex flex-col items-center mb-6">
        <!-- Logo provisional: reemplazar por el archivo real del hospital (assets/logo.svg) -->
        <svg viewBox="0 0 64 64" width="52" height="52" class="mb-2" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#eef7e6" />
          <path d="M32 14 C22 14 14 24 14 34 C20 30 26 30 32 36 C38 30 44 30 50 34 C50 24 42 14 32 14 Z" fill="#76b82a" />
          <path d="M32 20 C26 20 20 28 20 36 C25 33 29 33 32 38 C35 33 39 33 44 36 C44 28 38 20 32 20 Z" fill="#327531" />
          <circle cx="32" cy="25" r="4" fill="#ffffff" />
        </svg>
        <span class="font-display font-semibold text-sm text-hslv-navy tracking-wide">HOSPITAL</span>
        <span class="text-xs text-slate-600">Susana López de Valencia</span>
        <span class="text-[10px] text-slate-400 tracking-widest">E.S.E</span>
      </div>

      <h1 class="font-display text-sm font-medium text-hslv-navy text-center mb-1">Panel de gestión hospitalaria</h1>
      <p class="text-xs text-slate-500 text-center mb-6">Ingresa con tu cuenta institucional</p>

      <form id="login-form" novalidate>
        <label for="email" class="block text-xs text-slate-600 mb-1">Correo institucional</label>
        <input
          id="email" name="email" type="email" required
          placeholder="nombre@hosusana.gov.co"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4
                 focus:outline-none focus:ring-2 focus:ring-hslv-green-dark/40 focus:border-hslv-green-dark"
        />

        <label for="password" class="block text-xs text-slate-600 mb-1">Contraseña</label>
        <input
          id="password" name="password" type="password" required
          placeholder="Contraseña"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-3
                 focus:outline-none focus:ring-2 focus:ring-hslv-green-dark/40 focus:border-hslv-green-dark"
        />

        <div class="flex items-center justify-between mb-5">
          <label class="flex items-center gap-2 text-xs text-slate-600">
            <input type="checkbox" name="remember" class="w-3.5 h-3.5 accent-hslv-green-dark" />
            Recordarme
          </label>
          <a href="#" class="text-xs text-hslv-green-dark hover:underline">¿Olvidaste tu contraseña?</a>
        </div>

        <p id="login-error" class="hidden text-xs text-red-600 mb-3" role="alert"></p>

        <button
          type="submit"
          class="w-full bg-hslv-green-dark text-white rounded-lg py-2.5 text-sm font-medium
                 hover:bg-hslv-navy transition-colors"
        >
          Iniciar sesión
        </button>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorEl.textContent = 'Completa correo y contraseña para continuar.';
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.classList.add('hidden');

      // TODO: reemplazar por la llamada real, ej. POST /api/auth/login
      // fetch('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) })
      //   .then(...).catch(...)
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
